<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IUH BEAUTY - Đăng Ký Thành Viên</title>
    <link href="../css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/icon-don-gian.css">
      <script src="../js/cart-storage.js"></script>
    <script>
        // Kiểm tra ngay khi tải trang: Nếu đã đăng nhập -> Chuyển thẳng tới trang tài khoản
        (function checkAuth() {
            const currentUser = localStorage.getItem('iuh_user_logged');
            if (currentUser) {
                window.location.href = 'taikhoan.html';
            }
        })();
    </script>
    <style>
        :root { 
            --primary: #ef66ad; 
            --primary-hover: #e04f98;
            --bg-soft: #fcf4f8; 
        }
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background-color: var(--bg-soft); 
            color: #2c2c2c;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        a { text-decoration: none; }
        .auth-header { background: #fff; padding: 15px 0; }
        .auth-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(239, 102, 173, 0.08);
            border: none;
            padding: 40px;
            max-width: 480px;
            width: 100%;
            margin: auto;
        }
        .auth-title { color: #ef66ad; font-weight: 700; letter-spacing: 1px; }
        .form-label { font-weight: 600; font-size: 0.9rem; color: #4a4a4a; }
        .form-control { border-radius: 10px; padding: 12px 16px; border: 1px solid #e2e8f0; font-size: 0.95rem; }
        .form-control:focus { border-color: #ef66ad; box-shadow: 0 0 0 0.25rem rgba(239, 102, 173, 0.15); }
        .btn-submit { background-color: #ef66ad; border: none; color: white; font-weight: 600; padding: 12px; border-radius: 10px; transition: all 0.2s ease; }
        .btn-submit:hover { background-color: #e04f98; color: white; }
        .link-highlight { color: #ef66ad; font-weight: 600; cursor: pointer; }
        .link-highlight:hover { color: #e04f98; text-decoration: underline; }
    </style>
</head>
<body>
    <header class="auth-header shadow-sm">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand fw-bold fs-3" href="index.html" style="color: #ef66ad; letter-spacing: 2px;">
                IUH<small class="d-block text-muted fw-normal" style="font-size: 10px; letter-spacing: 4px;">BEAUTY</small>
            </a>
            <div class="d-flex align-items-center gap-4">
                <a href="index.html" class="text-secondary fw-semibold">Trang chủ</a>
                <a href="dangnhap.html" class="link-highlight">Đăng Nhập</a>
            </div>
        </div>
    </header>

    <main class="container my-5 d-flex align-items-center justify-content-center flex-grow-1">
        <div class="auth-card">
            <div class="text-center mb-4">
                <h2 class="auth-title mb-2">ĐĂNG KÝ THÀNH VIÊN</h2>
                <p class="text-muted small">Tạo tài khoản để trải nghiệm IUH BEAUTY</p>
            </div>

            <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="mb-3">
                    <label for="fullname" class="form-label">Họ và tên <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="fullname" placeholder="Ví dụ: Nguyễn Văn A" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email <span class="text-danger">*</span></label>
                    <input type="email" class="form-control" id="email" placeholder="email@example.com" required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Mật khẩu <span class="text-danger">*</span></label>
                    <input type="password" class="form-control" id="password" placeholder="Nhập mật khẩu tối thiểu 8 ký tự" minlength="8" required>
                </div>

                <div class="mb-4">
                    <label for="confirmPassword" class="form-label">Nhập lại mật khẩu <span class="text-danger">*</span></label>
                    <input type="password" class="form-control" id="confirmPassword" placeholder="Nhập lại mật khẩu" required>
                </div>

                <button type="submit" class="btn btn-submit w-100 mb-3">Tạo tài khoản</button>

                <div class="text-center small text-muted">
                    Đã có tài khoản? <a href="dangnhap.html" class="link-highlight">Đăng nhập</a>
                </div>
            </form>
        </div>
    </main>

    <script src="../js/bootstrap.bundle.min.js"></script>
    <script>
        const USERS_KEY = 'iuh_users';

        const form = document.getElementById('registerForm');
        const nameInput = document.getElementById('regName');
        const emailInput = document.getElementById('regEmail');
        const passwordInput = document.getElementById('regPassword');
        const confirmInput = document.getElementById('regConfirm');

        const registerError = document.getElementById('registerError');
        const successBox = document.getElementById('successBox');

        function getUsers() {
            try {
                const users = JSON.parse(
                    localStorage.getItem(USERS_KEY) || '[]'
                );

                return Array.isArray(users) ? users : [];
            } catch (error) {
                return [];
            }
        }

        function showFieldError(id, message) {
            document.getElementById(id).textContent = message;
        }

        function clearErrors() {
            document.querySelectorAll('.error-text').forEach(function (item) {
                item.textContent = '';
            });

            registerError.textContent = '';
            registerError.classList.add('d-none');
        }

        function showGeneralError(message) {
            registerError.textContent = message;
            registerError.classList.remove('d-none');
        }

        form.addEventListener('submit', function (event) {
            event.preventDefault();
            clearErrors();
            successBox.classList.add('d-none');

            const name = nameInput.value.trim();
            const email = emailInput.value.trim().toLowerCase();
            const password = passwordInput.value;
            const confirmPassword = confirmInput.value;

            let valid = true;

            // Kiểm tra họ tên
            if (name === '') {
                showFieldError('nameError', 'Vui lòng nhập họ và tên.');
                valid = false;
            } else if (name.length > 100) {
                showFieldError('nameError', 'Họ và tên không được quá 100 ký tự.');
                valid = false;
            }

            // Kiểm tra email
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (email === '') {
                showFieldError('emailError', 'Vui lòng nhập email.');
                valid = false;
            } else if (!emailRegex.test(email)) {
                showFieldError('emailError', 'Email không đúng định dạng.');
                valid = false;
            }

            // Kiểm tra mật khẩu
            if (password === '') {
                showFieldError('passwordError', 'Vui lòng nhập mật khẩu.');
                valid = false;
            } else if (password.length < 8) {
                showFieldError('passwordError', 'Mật khẩu phải có ít nhất 8 ký tự.');
                valid = false;
            }

            // Kiểm tra nhập lại mật khẩu
            if (confirmPassword === '') {
                showFieldError('confirmError', 'Vui lòng nhập lại mật khẩu.');
                valid = false;
            } else if (password !== confirmPassword) {
                showFieldError('confirmError', 'Mật khẩu nhập lại không khớp.');
                valid = false;
            }

            if (!valid) return;

            // Đọc danh sách tài khoản hiện có
            const users = getUsers();

            // Không cho đăng ký email trùng
            const emailExists = users.some(function (user) {
                return user.email &&
                    user.email.toLowerCase() === email;
            });

            if (emailExists) {
                showFieldError(
                    'emailError',
                    'Email này đã được đăng ký. Vui lòng sử dụng email khác.'
                );
                return;
            }

            // Lưu tài khoản theo đúng cấu trúc trang chủ đang dùng
            const newUser = {
                name: name,
                email: email,
                password: password
            };

            try {
                users.push(newUser);
                localStorage.setItem(USERS_KEY, JSON.stringify(users));
            } catch (error) {
                showGeneralError(
                    'Không thể lưu tài khoản. Vui lòng kiểm tra bộ nhớ trình duyệt.'
                );
                return;
            }

            // Hiển thị thông tin đăng ký thành công
            document.getElementById('resultName').textContent = name;
            document.getElementById('resultEmail').textContent = email;
            document.getElementById('resultDate').textContent =
                new Date().toLocaleDateString('vi-VN');

            form.classList.add('d-none');
            successBox.classList.remove('d-none');

            successBox.scrollIntoView({
                behavior: 'smooth',
                block: 'center'
            });
        });
    </script>
</body>
</html>
