<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IUH BEAUTY - Đăng Nhập Thành Viên</title>
    <link href="../css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/icon-don-gian.css">
    <script src="../js/cart-storage.js"></script>
    <script>
        // Kiểm tra ngay khi tải trang: Nếu đã đăng nhập -> Chuyển thẳng tới trang tài khoản
        (function checkAuth() {
            const currentUser = localStorage.getItem('iuh_user_logged');
            if (currentUser) {
                window.location.href = 'taikhoan.html';
            }
        })();
    </script>
    <style>
        :root { 
            --primary: #ef66ad; 
            --primary-hover: #e04f98;
            --bg-soft: #fcf4f8; 
        }
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background-color: var(--bg-soft); 
            color: #2c2c2c;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        a { text-decoration: none; }
        .auth-header { background: #fff; padding: 15px 0; }
        .auth-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(239, 102, 173, 0.08);
            border: none;
            padding: 40px;
            max-width: 480px;
            width: 100%;
            margin: auto;
        }
        .auth-title { color: #ef66ad; font-weight: 700; letter-spacing: 1px; }
        .form-label { font-weight: 600; font-size: 0.9rem; color: #4a4a4a; }
        .form-control { border-radius: 10px; padding: 12px 16px; border: 1px solid #e2e8f0; font-size: 0.95rem; }
        .form-control:focus { border-color: #ef66ad; box-shadow: 0 0 0 0.25rem rgba(239, 102, 173, 0.15); }
        .btn-submit { background-color: #ef66ad; border: none; color: white; font-weight: 600; padding: 12px; border-radius: 10px; transition: all 0.2s ease; }
        .btn-submit:hover { background-color: #e04f98; color: white; }
        .link-highlight { color: #ef66ad; font-weight: 600; }
        .link-highlight:hover { color: #e04f98; text-decoration: underline; }
    </style>
</head>
<body>
    <header class="auth-header shadow-sm">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand fw-bold fs-3" href="index.html" style="color: #ef66ad; letter-spacing: 2px;">
                IUH<small class="d-block text-muted fw-normal" style="font-size: 10px; letter-spacing: 4px;">BEAUTY</small>
            </a>
            <div class="d-flex align-items-center gap-4">
                <a href="index.html" class="text-secondary fw-semibold">Trang chủ</a>
                <a href="dangky.html" class="link-highlight">Đăng Ký</a>
            </div>
        </div>
    </header>

    <main class="container my-5 d-flex align-items-center justify-content-center flex-grow-1">
        <div class="auth-card">
            <div class="text-center mb-4">
                <h2 class="auth-title mb-2">ĐĂNG NHẬP THÀNH VIÊN</h2>
                <p class="text-muted small">Chào mừng bạn trở lại với IUH BEAUTY</p>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="mb-3">
                    <label for="email" class="form-label">Email <span class="text-danger">*</span></label>
                    <input type="email" class="form-control" id="email" placeholder="email@example.com" required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Mật khẩu <span class="text-danger">*</span></label>
                    <input type="password" class="form-control" id="password" placeholder="Nhập mật khẩu của bạn" required>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4 small">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="rememberMe">
                        <label class="form-check-label text-muted" for="rememberMe">Ghi nhớ đăng nhập</label>
                    </div>
                    <a href="#" class="text-muted text-decoration-none" onclick="alert('Tính năng quên mật khẩu đang được phát triển!')">Quên mật khẩu?</a>
                </div>

                <button type="submit" class="btn btn-submit w-100 mb-3">Đăng nhập</button>

                <div class="text-center small text-muted">
                    Chưa có tài khoản? <a href="dangky.html" class="link-highlight">Đăng ký ngay</a>
                </div>
            </form>
        </div>
    </main>

    <script src="../js/bootstrap.bundle.min.js"></script>
    <script>
       const USERS_KEY = 'iuh_users';
        const LOGGED_KEY = 'iuh_user_logged';

        const form = document.getElementById('loginForm');
        const emailInput = document.getElementById('loginEmail');
        const passwordInput = document.getElementById('loginPassword');
        const loginError = document.getElementById('loginError');

        // Hàm đọc danh sách người dùng từ localStorage (khớp với trang đăng ký)
        function getUsers() {
            try {
                const users = JSON.parse(localStorage.getItem(USERS_KEY) || '[]');
                return Array.isArray(users) ? users : [];
            } catch (error) {
                return [];
            }
        }

        function showFieldError(id, message) {
            document.getElementById(id).textContent = message;
        }

        function clearErrors() {
            document.querySelectorAll('.error-text').forEach(function (item) {
                item.textContent = '';
            });
            loginError.textContent = '';
            loginError.classList.add('d-none');
        }

        function showGeneralError(message) {
            loginError.textContent = message;
            loginError.classList.remove('d-none');
        }

        form.addEventListener('submit', function (event) {
            event.preventDefault();
            clearErrors();

            const email = emailInput.value.trim().toLowerCase();
            const password = passwordInput.value;

            let valid = true;

            // Biểu thức chính quy kiểm tra định dạng email (y chang trang đăng ký)
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            // 1. Kiểm tra định dạng Email bằng Regex
            if (email === '') {
                showFieldError('emailError', 'Vui lòng nhập email.');
                valid = false;
            } else if (!emailRegex.test(email)) {
                showFieldError('emailError', 'Email không đúng định dạng chuẩn.');
                valid = false;
            }

            // 2. Kiểm tra Mật khẩu
            if (password === '') {
                showFieldError('passwordError', 'Vui lòng nhập mật khẩu.');
                valid = false;
            } else if (password.length < 8) {
                showFieldError('passwordError', 'Mật khẩu phải có ít nhất 8 ký tự.');
                valid = false;
            }

            if (!valid) return;

            // 3. Đối chiếu thông tin tài khoản đã đăng ký trong localStorage
            const users = getUsers();
            const matchedUser = users.find(function (user) {
                return user.email && 
                       user.email.toLowerCase() === email && 
                       user.password === password;
            });

            if (!matchedUser) {
                showGeneralError('Email hoặc mật khẩu không chính xác.');
                return;
            }

            // Đăng nhập thành công -> Lưu phiên đăng nhập & chuyển sang trang tài khoản
            const loggedUser = {
                fullname: matchedUser.name || matchedUser.fullname || email.split('@')[0],
                email: matchedUser.email
            };

            localStorage.setItem(LOGGED_KEY, JSON.stringify(loggedUser));
            alert('Đăng nhập thành công!');
            window.location.href = 'taikhoan.html';
        });
    </script>
</body>
</html>
